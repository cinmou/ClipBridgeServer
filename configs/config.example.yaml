# ClipBridgeServer example configuration.
#
# Copy this file to `config.yaml` in the project root before running the server:
#
#   cp configs/config.example.yaml config.yaml

auth:
  # Shared admin token for management APIs such as pairing code generation and
  # cleanup settings. Leave empty to let the server generate one under
  # `data/secrets/admin_token`.
  token: ""

server:
  # Listen address.
  # 0.0.0.0 means the server accepts connections from other devices in the LAN.
  # Use 127.0.0.1 if you only want local access during development.
  host: "127.0.0.1"

  # HTTP port used by the API server.
  port: 8787

tls:
  # Keep disabled unless you have a certificate and key configured.
  enabled: false
  cert_file: ""
  key_file: ""

storage:
  # Directory used by the server to store runtime data.
  data_dir: "./data"

  # SQLite database path.
  database_path: "./data/clipbridge.db"

  # Default retention TTL for non-favorite items in hours.
  ttl_hours: 168

  # Default maximum number of active history items.
  max_items: 1000

  # Default maximum active storage size in MB.
  max_total_size_mb: 2048

limits:
  # Minimum allowed text clipboard size in bytes.
  min_text_bytes: 1

  # Maximum allowed text clipboard size in bytes.
  max_text_bytes: 262144

  # Minimum allowed image clipboard size in bytes.
  min_image_bytes: 1

  # Maximum allowed image clipboard size in bytes.
  max_image_bytes: 10485760

  # Minimum allowed file clipboard size in bytes.
  min_file_bytes: 1

  # Maximum allowed file clipboard size in bytes.
  max_file_bytes: 52428800

  # Minimum allowed link clipboard size in bytes.
  min_link_bytes: 1

  # Maximum allowed link clipboard size in bytes.
  max_link_bytes: 8192

  # Maximum allowed HTTP request body size in bytes.
  max_request_bytes: 1048576

cleaner:
  # Background cleanup worker switch.
  enabled: true

  # How often the worker should wake up and reload policy.
  interval_minutes: 30

# WebDAV settings are intentionally not stored here in phase 11.
# They are runtime-persisted through the settings table so users can update
# them from the embedded Web UI or the settings API without restarting.
