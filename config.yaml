

# ClipBridgeServer example configuration.
#
# Copy this file to `config.yaml` in the project root before running the server:
#
#   cp configs/config.example.yaml config.yaml
#
# Then change `auth.token` to a private value.

server:
  # Listen address.
  # 0.0.0.0 means the server accepts connections from other devices in the LAN.
  # Use 127.0.0.1 if you only want local access during development.
  host: "0.0.0.0"

  # HTTP port used by the API server.
  port: 8787

  # Graceful shutdown timeout in seconds.
  shutdown_timeout_seconds: 10

auth:
  # Bearer token used by clients.
  # Every protected API request must include:
  #
  #   Authorization: Bearer dev-token-please-change
  #
  # Do not use this default value in real deployment.
  token: "dev-token-123"

storage:
  # Directory used by the server to store runtime data.
  data_dir: "./data"

  # SQLite database path.
  database_path: "./data/clipbridge.db"

  # Normal, non-favorite clipboard items expire after this many hours.
  # Favorite items are not removed by TTL cleanup.
  ttl_hours: 168

  # Maximum number of non-deleted history items to keep.
  # Old non-favorite items will be removed first when cleanup is implemented.
  max_items: 1000

  # Maximum total storage size in MB.
  # This mainly protects small devices such as NAS boxes, routers, and mini PCs.
  max_total_size_mb: 2048

limits:
  # Minimum and maximum text clipboard size in bytes.
  min_text_bytes: 1
  max_text_bytes: 262144

  # Minimum and maximum image clipboard size in bytes.
  min_image_bytes: 1
  max_image_bytes: 10485760

  # Minimum and maximum file clipboard size in bytes.
  min_file_bytes: 1
  max_file_bytes: 52428800

  # Minimum and maximum link size in bytes.
  min_link_bytes: 1
  max_link_bytes: 8192

  # Maximum HTTP request body size in bytes.
  max_request_bytes: 62914560

cleaner:
  # Background cleanup worker switch.
  enabled: true

  # How often the cleanup worker should run.
  interval_minutes: 30

security:
  # Current options:
  #   none   - no content encryption, only token authentication
  #
  # Future options:
  #   server - server-side encryption before writing to disk
  #   e2ee   - end-to-end encryption, clients encrypt before upload
  encryption_mode: "none"

webdav:
  # WebDAV sync is planned for a future milestone.
  # Keep it disabled for the first MVP.
  enabled: false

  endpoint: ""
  username: ""
  password: ""
  remote_path: "/ClipBridgeServer"
  sync_interval_minutes: 60